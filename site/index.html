};
const tg = window.Telegram && Telegram.WebApp;
const q = new URLSearchParams(location.search).get("lang");
let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
const tgl = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.language_code : "";
let lang = [q, saved, (tgl || "").slice(0, 2)].find(x => I[x]) || "uz";

  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = I[lang][el.dataset.i] || ""; });

async function call(path) {
  const r = await fetch(API + path, { headers: { Authorization: "tma " + tg.initData } });
  if (!r.ok) throw new Error(r.status); return r.json();
}

async function load(tab) {
